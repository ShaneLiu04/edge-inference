[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-deploy"
version = "0.1.0"
description = "Edge and on-device inference labs, measurements and the shared CPU benchmark harness"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["edge_harness*"]

[tool.ruff]
line-length = 130
src = ["edge_harness", "tools", "solutions"]
extend-exclude = ["assignments", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"solutions/**/scripts/*.py" = ["E402"]
"solutions/**/tests/*.py" = ["E402"]
"tools/tests/*.py" = ["E402"]
"solutions/mlc/tensor-program-tuning/code/tuner/runner.py" = ["E501"]  # generated C++ source lines
